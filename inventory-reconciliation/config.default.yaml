# Default normalization rules for inventory reconciliation.
# Override any section by creating a custom config and passing --config <path>.

sku:
  pattern: "^SKU-?(\\d+)$"
  format: "SKU-{:03d}"
  case: upper

quantity:
  allow_fractional: false
  allow_negative: false

date:
  formats:
    - "%Y-%m-%d"
    - "%m/%d/%Y"
    - "%d-%b-%Y"      # e.g. 15-Jan-2024
    - "%Y/%m/%d"       # e.g. 2024/01/15
  output_format: "%Y-%m-%d"

name:
  strip_whitespace: true
  unicode_normalize: NFKC

location:
  title_case: true
  unicode_normalize: NFKC

priority:
  high_threshold_pct: 10    # >10% variance → high
  medium_threshold_pct: 5   # 5-10% variance → medium, <5% → low
