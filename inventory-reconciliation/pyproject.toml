[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-reconciliation"
version = "0.1.0"
description = "Pipeline for reconciling inventory snapshots and generating reports"
readme = "PROJECT-README.md"
authors = [{name = "Assessment Candidate"}]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "PyYAML>=6.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.4.0", "mypy>=1.10.0", "pandas-stubs>=2.0.0"]

[tool.setuptools]
packages = ["reconciliation"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
